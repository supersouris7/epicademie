name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Annule les runs obsolètes d'une branche ; jamais sur main ni sur les étiquettes (publication).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

permissions:
  contents: read

# Actions tierces épinglées par empreinte de commit (version en commentaire) : une étiquette
# déplacée ne peut pas injecter de code dans la CI. Dependabot propose les mises à jour.
#
# Exécution sur le runner auto-hébergé « mini-pc » (docs/operations/ci-runner.md). Il n'est pas
# éphémère : chaque job nettoie son espace de travail, n'utilise aucun port fixe de la machine et
# ne lance rien pour les PR venant de forks (garde `if` + réglage du dépôt).

jobs:
  quality:
    name: Lint, types, tests, build, E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, questeo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      # Le magasin pnpm (~/.local/share/pnpm) est persistant sur le runner : pas de cache distant.
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Règles d'architecture : dépendances entre paquets, modules et fonctionnalités, cycles.
      - run: pnpm arch
      # Code mort : fichiers, exports et dépendances inutilisés.
      - run: pnpm deadcode
      # Tests unitaires et d'intégration (PostgreSQL embarqué), seuils de couverture bloquants.
      - run: pnpm test:coverage --maxWorkers=2
      # Chromium est déjà dans ~/.cache/ms-playwright (no-op si la version correspond) ; pas de sudo.
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e
        env:
          E2E_PORT: '3100'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Nettoyage
        if: always()
        run: rm -rf playwright-report test-results coverage node_modules

  # Les tests du serveur rejoués sur un vrai PostgreSQL (même version que la production).
  postgres:
    name: Intégration PostgreSQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, questeo]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: questeo
          POSTGRES_PASSWORD: questeo
          POSTGRES_DB: questeo
        ports: ['5432'] # port hôte attribué dynamiquement (5432 peut être pris sur le runner)
        options: >-
          --health-cmd "pg_isready -U questeo" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      # Le magasin pnpm (~/.local/share/pnpm) est persistant sur le runner : pas de cache distant.
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec vitest run --project @questeo/server --maxWorkers=2
        env:
          TEST_DATABASE_URL: postgres://questeo:questeo@localhost:${{ job.services.postgres.ports['5432'] }}/questeo
      - name: Nettoyage
        if: always()
        run: rm -rf coverage node_modules

  # Analyse de sécurité de l'image de production (paquets système et dépendances Node) :
  # bloquante s'il reste une faille grave ou critique pour laquelle un correctif existe.
  image-scan:
    name: Analyse de sécurité de l'image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, questeo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pilote Docker par défaut : les couches restent en cache dans le démon du runner.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: questeo:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: questeo:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Nettoyage
        if: always()
        run: docker image rm questeo:scan || true; docker image prune -f

  docker:
    name: Image Docker → Docker Hub
    needs: [quality, postgres, image-scan]
    # main (unstable) et étiquettes de version ; jamais les PR.
    if: github.event_name == 'push'
    runs-on: [self-hosted, questeo]
    timeout-minutes: 45
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Vérifier les secrets Docker Hub
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents — publication ignorée."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/questeo
          # main → unstable (+ sha) ; tag v1.0.1 → 1.0.1, 1.0, 1, latest
          tags: |
            type=raw,value=unstable,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: env.HAS_DOCKERHUB == 'true'
        with:
          context: .
          platforms: linux/amd64 # arm64 (QEMU) retiré : trop lourd pour le mini-pc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
      - name: Déconnexion et nettoyage
        if: always() && env.HAS_DOCKERHUB == 'true'
        run: docker logout; docker image prune -f
