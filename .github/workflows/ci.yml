name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  # Analyse hebdomadaire de l'image : nouvelles failles publiées sans changement de code.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

permissions:
  contents: read

# Actions tierces épinglées par empreinte de commit (version en commentaire) : une étiquette
# déplacée ne peut pas injecter de code dans la CI. Dependabot propose les mises à jour.
#
# Rapidité et pas de sur-test (#68) :
#  - contrôles statiques, tests et E2E (un job par appareil) en parallèle ;
#  - seuls les contrôles concernés par les fichiers modifiés de la PR sont lancés ;
#  - après la fusion d'une PR dont la CI était verte, rien n'est rejoué sur main : publication seule ;
#    exception (#96) : une PR de contenu (packages/content), dont les e2e n'ont pas tourné, les rejoue sur main
#    (les e2e restent obligatoires après fusion) ;
#  - une PR qui ne touche que packages/content et docs : typage, lint, format, architecture, code mort, tests du
#    paquet content (validation des notions comprise), ni e2e, ni PostgreSQL, ni image ;
#  - commit direct sur main, tag de version, lancement manuel ou modification de la CI : tout est lancé.

jobs:
  changements:
    name: Contrôles à lancer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      statique: ${{ steps.c.outputs.statique }}
      tests: ${{ steps.c.outputs.tests }}
      tests_contenu: ${{ steps.c.outputs.tests_contenu }}
      e2e: ${{ steps.c.outputs.e2e }}
      postgres: ${{ steps.c.outputs.postgres }}
      image: ${{ steps.c.outputs.image }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out() { echo "$1=true" >> "$GITHUB_OUTPUT"; echo "→ $1"; }
          tout() { for k in statique tests e2e postgres image; do out "$k"; done; }
          # Changements qui exigent les e2e (3 appareils) : application, e2e, moteur et types partagés, outillage.
          E2E_RE='^(apps|e2e)/|^packages/(shared|engine)/|^playwright\.config|^package\.json$|^pnpm-(lock|workspace)\.yaml$|^tsconfig'
          # Contenu pédagogique et documentation seulement : le reste du dépôt n'est pas touché.
          CONTENU_RE='^(packages/content/|docs/)|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$|\.md$'
          # classe : lit des noms de fichiers ; écrit les sorties « statique », « tests », « tests_contenu », « e2e », … à lancer.
          classe() {
            local files; files=$(cat)
            if ! grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/dependabot\.yml$)|\.md$' <<<"$files"; then
              echo "Documentation uniquement : format et contrôles statiques seulement."; out statique; return
            fi
            out statique; out tests
            # Contenu seul : seuls les tests du paquet content (validation des notions, sources, relectures) ; ni e2e ni PostgreSQL.
            if ! grep -qvE "$CONTENU_RE" <<<"$files"; then echo "Contenu et documentation seulement : tests du paquet content, ni e2e ni PostgreSQL."; out tests_contenu; fi
            grep -qE "$E2E_RE" <<<"$files" && out e2e
            grep -qE '^(apps/server|packages/(shared|engine))/|^package\.json$|^pnpm-lock\.yaml$|^vitest\.' <<<"$files" && out postgres
            grep -qE '^(Dockerfile|\.dockerignore)$|(^|/)package\.json$|^pnpm-lock\.yaml$' <<<"$files" && out image
            return 0
          }
          case "$EVENT" in
            schedule) out image; exit 0 ;;
            workflow_dispatch) tout; exit 0 ;;
            push)
              if [[ $GITHUB_REF == refs/tags/* ]]; then tout; exit 0; fi
              pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].number // empty")
              if [[ -n $pr ]]; then
                head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
                ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" --jq .total_count)
                if (( ok > 0 )); then
                  pfiles=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[].filename')
                  if grep -qE "$E2E_RE" <<<"$pfiles"; then
                    echo "::notice::PR #$pr déjà validée par la CI, e2e compris : contrôles non rejoués, publication seule."
                  elif grep -q '^packages/content/' <<<"$pfiles"; then
                    echo "::notice::PR #$pr de contenu : ses e2e n'avaient pas tourné, ils sont rejoués sur main (obligatoires après fusion)."
                    out e2e
                  else
                    echo "::notice::PR #$pr de documentation déjà validée : publication seule."
                  fi
                  exit 0
                fi
                echo "::warning::PR #$pr fusionnée sans CI verte sur son dernier commit : CI complète."
              fi
              tout; exit 0 ;;
          esac
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          printf '%s\n' "$files" | sed 's/^/  /'
          has() { grep -qE "$1" <<<"$files"; }
          if has '^\.github/(workflows|actions)/'; then echo "CI modifiée : tous les contrôles."; tout; exit 0; fi
          classe <<<"$files"
          exit 0

  statique:
    name: Format, lint, types, architecture, code mort
    needs: changements
    if: needs.changements.outputs.statique == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparer
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Règles d'architecture : dépendances entre paquets, modules et fonctionnalités, cycles.
      - run: pnpm arch
      # Code mort : fichiers, exports et dépendances inutilisés.
      - run: pnpm deadcode

  tests:
    name: Tests et couverture
    needs: changements
    if: needs.changements.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparer
      # Tests unitaires et d'intégration (PostgreSQL embarqué), seuils de couverture bloquants.
      - if: needs.changements.outputs.tests_contenu != 'true'
        run: pnpm test:coverage
      # PR de contenu seul (#96) : tests du paquet content seulement (validation des notions, sources, relectures ;
      # environ 1 min contre plusieurs avec serveur et web). Pas de mesure de couverture dans ce mode : les seuils
      # restent contrôlés par toute PR qui touche autre chose que le contenu.
      - if: needs.changements.outputs.tests_contenu == 'true'
        run: pnpm exec vitest run --project @epicademie/content

  e2e:
    name: E2E (${{ matrix.appareil }})
    needs: changements
    if: needs.changements.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appareil: [tablette, smartphone, ordinateur-tv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparer
      - name: Cache des navigateurs Playwright
        id: navigateurs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.navigateurs.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.navigateurs.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --project=${{ matrix.appareil }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.appareil }}
          path: playwright-report
          retention-days: 7

  # Les tests du serveur rejoués sur un vrai PostgreSQL (même version que la production),
  # seulement si le serveur, les paquets partagés ou les dépendances changent.
  postgres:
    name: Intégration PostgreSQL
    needs: changements
    if: needs.changements.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: epicademie
          POSTGRES_PASSWORD: epicademie
          POSTGRES_DB: epicademie
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U epicademie" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://epicademie:epicademie@localhost:5432/epicademie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/preparer
      - run: pnpm exec vitest run --project @epicademie/server

  # Analyse de sécurité de l'image de production (paquets système et dépendances Node) :
  # bloquante s'il reste une faille grave ou critique pour laquelle un correctif existe.
  # Lancée si l'image ou les dépendances changent, et chaque semaine.
  image-scan:
    name: Analyse de sécurité de l'image
    needs: changements
    if: needs.changements.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: epicademie:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: epicademie:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Synthèse unique (contrôle obligatoire possible) : échoue si un contrôle lancé a échoué.
  ci:
    name: CI
    needs: [changements, statique, tests, e2e, postgres, image-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Résultat
        env:
          RESULTATS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTATS"
          if grep -qE '"(failure|cancelled)"' <<<"$RESULTATS"; then exit 1; fi

  docker:
    name: Image Docker → Docker Hub
    needs: [ci]
    # !cancelled() : sinon le job est sauté dès qu'un job en amont l'a été (contrôles non rejoués).
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Vérifier les secrets Docker Hub
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents — publication ignorée."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/epicademie
          # main → unstable (+ sha) ; tag v1.0.1 → 1.0.1, 1.0, 1, latest
          tags: |
            type=raw,value=unstable,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: env.HAS_DOCKERHUB == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
